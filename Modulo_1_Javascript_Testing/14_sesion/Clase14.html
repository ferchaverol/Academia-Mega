<!DOCTYPE html>        
<html lang="es">
    <head>
        <meta charset="UFT-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clase 14: TDD</title>
    </head>
<body>
    <h1>Clase 14: Intro TDD</h1>
    <script>
        function expect(actual){
            return{
                toBe(expected){
                    if(actual === expected){
                        console.log("paso")
                    }else{
                        console.error(`fallo: esperado ${expected}, recibido ${actual}`);
                    }
                }
            }
        }

        function espar(n){
            if(typeof n !== "number") return false;
            return n % 2 === 0;
        }

        expect(espar(2)).toBe(true)
        expect(espar(3)).toBe(false)
    </script>
</body>
</html>
